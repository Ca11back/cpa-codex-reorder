name: Release

# Builds and tests the supported release packages on native runners, then
# verifies them with CPA's own installer. "verify" only uploads a workflow
# artifact; "publish" also creates the GitHub Release v<version>.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Plugin version without the v prefix (must match pluginVersion in plugin.go)
        required: true
        type: string
      mode:
        description: verify = build and check only; publish = also create the GitHub Release
        required: true
        default: verify
        type: choice
        options:
          - verify
          - publish
      notes:
        description: Release notes (publish only; markdown)
        required: false
        type: string

permissions:
  contents: read

env:
  CPA_VERSION: '8.1.1'

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet test

  build:
    name: build and test ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            extension: so
            cpa_archive: linux_amd64.tar.gz
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            extension: so
            cpa_archive: linux_aarch64.tar.gz
          - goos: darwin
            goarch: arm64
            runner: macos-15
            extension: dylib
            cpa_archive: darwin_aarch64.tar.gz
          - goos: windows
            goarch: amd64
            runner: windows-2025
            extension: dll
            cpa_archive: windows_amd64.zip
          - goos: windows
            goarch: arm64
            runner: windows-11-arm
            extension: dll
            cpa_archive: windows_aarch64.zip
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.goos }}_${{ matrix.goarch }}
      LIBRARY: codex-reorder.${{ matrix.extension }}
      CPA_ASSET_SUFFIX: ${{ matrix.cpa_archive }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Build in manylinux2014
        if: matrix.goos == 'linux'
        run: scripts/build-manylinux.sh "${{ matrix.goarch }}"
      - name: Set up Windows ARM64 C compiler
        if: matrix.goos == 'windows' && matrix.goarch == 'arm64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=20261117
          toolchain="llvm-mingw-${version}-ucrt-aarch64"
          mkdir -p dist/toolchain
          cd dist/toolchain
          gh release download "$version" --repo mstorsjo/llvm-mingw --pattern "$toolchain.zip"
          printf '%s  %s\n' c7f56de1d7aca15196c19083a799205390397b8b87a825aec3485e1e4f3c2cdd "$toolchain.zip" | sha256sum -c
          export TOOLCHAIN_ZIP="$toolchain.zip"
          powershell -NoProfile -Command 'Expand-Archive -LiteralPath $env:TOOLCHAIN_ZIP -DestinationPath .'
          cygpath -w "$PWD/$toolchain/bin" >> "$GITHUB_PATH"
          echo 'CC=aarch64-w64-mingw32-clang' >> "$GITHUB_ENV"
      - name: Build native library
        if: matrix.goos != 'linux'
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          [[ "$(go env GOOS)_$(go env GOARCH)" == "$TARGET" ]]
          "$(go env CC)" --version
          mkdir -p "dist/lib/$TARGET"
          go build -buildmode=c-shared -trimpath -buildvcs=false -ldflags="-s -w" -o "dist/lib/$TARGET/$LIBRARY" .
          rm "dist/lib/$TARGET/${LIBRARY%.*}.h"
      - name: Test with native CPA and a mock Codex upstream
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export CPA_ARCHIVE="CLIProxyAPI_${CPA_VERSION}_${CPA_ASSET_SUFFIX}"
          mkdir -p dist/cpa
          gh release download "v$CPA_VERSION" --repo router-for-me/CLIProxyAPI \
            --pattern "$CPA_ARCHIVE" --pattern checksums.txt --dir dist/cpa
          (
            cd dist/cpa
            grep -F "  $CPA_ARCHIVE" checksums.txt > cpa.sha256
            if [[ "$TARGET" == darwin_* ]]; then
              shasum -a 256 -c cpa.sha256
            else
              sha256sum -c cpa.sha256
            fi
            if [[ "$TARGET" == windows_* ]]; then
              powershell -NoProfile -Command 'Expand-Archive -LiteralPath $env:CPA_ARCHIVE -DestinationPath .'
            else
              tar -xf "$CPA_ARCHIVE"
            fi
          )
          cpa=dist/cpa/cli-proxy-api
          if [[ "$TARGET" == windows_* ]]; then cpa="$cpa.exe"; fi
          go run ./test/smoke -quick -cpa "$cpa" -plugin "dist/lib/$TARGET/$LIBRARY" -run dist/native-smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: smoke-log-${{ env.TARGET }}
          path: dist/native-smoke/cpa.log
      - uses: actions/upload-artifact@v4
        with:
          name: lib-${{ env.TARGET }}
          path: dist/lib/${{ env.TARGET }}/${{ env.LIBRARY }}
          if-no-files-found: error

  package:
    needs: [test, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      MODE: ${{ inputs.mode }}
      NOTES: ${{ inputs.notes }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          pattern: lib-*
          path: dist/lib
      - name: Lay out libraries
        run: |
          for dir in dist/lib/lib-*; do mv "$dir" "dist/lib/${dir#dist/lib/lib-}"; done
          ls -lR dist/lib
      - name: Package and verify with CPA's installer
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad version: $VERSION" >&2; exit 1; }
          make release-package VERSION="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: codex-reorder_${{ inputs.version }}
          path: dist/release/
          if-no-files-found: error
      - name: Create GitHub Release
        if: inputs.mode == 'publish'
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists" >&2
            exit 1
          fi
          notes="${NOTES:-codex-reorder ${tag}}"
          gh release create "$tag" dist/release/* \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes "$notes"
